name = "renewera-freegift"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Single Worker serves the static frontend (apps/web) AND the API.
# Static assets win first; only unmatched paths fall through to Hono.
[assets]
directory = "../web"
not_found_handling = "404-page"

[triggers]
crons = ["0 13 * * *"]   # 13:00 UTC = 8am ET / 9am EDT — daily housekeeping

# Real-time logs in the Cloudflare dashboard (Worker → Logs tab).
[observability.logs]
enabled = true
invocation_logs = true

[vars]
TELEGRAM_CHAT_ID  = "-5234908131"
RESEND_FROM       = "Renewera <contact@renewera.co>"
CLAIM_LINK_BASE   = "https://renewera.co/freegift/claim"
TURNSTILE_SITEKEY = "0x4AAAAAAC_ff2OrJKG-uvkK"
ENVIRONMENT       = "production"

# ───────────────────────────────────────────────────────────────
# Staging — isolated environment for building the website + admin.
# Deploys to renewera-freegift-staging.<account>.workers.dev with
# NO custom domain and NO cron, so it can never touch production
# traffic or run scheduled jobs against the shared database.
# Deploy with:  pnpm -F api deploy --env staging
# ───────────────────────────────────────────────────────────────
[env.staging]
name = "renewera-freegift-staging"
workers_dev = true

[env.staging.assets]
directory = "../web"
not_found_handling = "404-page"

# CRITICAL: `triggers` is an INHERITABLE wrangler key — if omitted here,
# staging silently inherits the production cron and double-runs the daily
# job against the shared Supabase DB. An explicit empty array disables it.
[env.staging.triggers]
crons = []

[env.staging.vars]
TELEGRAM_CHAT_ID  = "-5234908131"
RESEND_FROM       = "Renewera Staging <contact@renewera.co>"
CLAIM_LINK_BASE   = "https://renewera.co/freegift/claim"
TURNSTILE_SITEKEY = "0x4AAAAAAC_ff2OrJKG-uvkK"
ENVIRONMENT       = "staging"

# Secrets (set via `wrangler secret put NAME`):
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#   SUPABASE_WEBHOOK_SECRET
#   RESEND_API_KEY
#   TURNSTILE_SECRET_KEY
#   TELEGRAM_BOT_TOKEN
