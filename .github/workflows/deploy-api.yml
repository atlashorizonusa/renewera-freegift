name: Deploy API (Cloudflare Worker)

# Manual fallback only. Cloudflare Workers Builds is the primary
# deploy path — it auto-runs `npx wrangler deploy` from apps/api on
# every push to main. This workflow exists in case that breaks or
# you want to push a staging build without touching main.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Worker env (production or staging)"
        type: choice
        default: production
        options: [production, staging]

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm -F api typecheck

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: >-
            deploy ${{ github.event.inputs.environment == 'staging' && '--env staging' || '' }}
